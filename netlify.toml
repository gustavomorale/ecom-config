# Netlify deploy for the Shopify app (admin + webhooks). Lives at the repo root
# because GitHub-triggered builds read it from there; base points at shopify-app/. The storefront widget
# is not served from here: the theme app extension ships it via Shopify's CDN.
#
# Site settings to create once in the Netlify UI (Site configuration > Environment):
#   SHOPIFY_API_KEY, SHOPIFY_API_SECRET   from the Partner dashboard / shopify app env show
#   SHOPIFY_APP_URL                        https://<site>.netlify.app
#   SCOPES                                 read_products,read_themes
#   DATABASE_URL                           Neon Postgres connection string (pooled)
#   BCFG_BILLING                           off while in beta; "on" to charge
# Then point shopify.app.toml application_url / redirect_urls at the same URL
# and run `npm run deploy` (shopify app deploy) to push the extension and config.

[build]
  base = "shopify-app"
  command = "npm run netlify:build"
  publish = "build/client"
  # Build when the app or the runtime it bundles changed (the base directory alone is not enough).
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ../src ../configs ../scripts ../netlify.toml"

[build.environment]
  NODE_VERSION = "22"
  NPM_FLAGS = "--include=dev"

[functions]
  node_bundler = "esbuild"
  # The server reads the category registry and runtime sources at request time
  # (app/config.server.js, app/theme.server.js) and Prisma needs its engine.
  included_files = [
    "../configs/**",
    "../src/**",
    "node_modules/.prisma/client/**",
    "node_modules/@prisma/client/**",
    "prisma/schema.prisma"
  ]

[[headers]]
  for = "/widget/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"
