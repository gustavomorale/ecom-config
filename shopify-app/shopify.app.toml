# Shopify app configuration for Bundle Configurator.
# client_id is filled in by `shopify app dev` (or `shopify app config link`) the first time
# it runs against the Partners org. That step is interactive and happens once. No secrets here.

client_id = ""
name = "Bundle Configurator"
handle = "bundle-configurator"
application_url = "https://example.com"   # rewritten automatically during `shopify app dev`
embedded = true

[build]
dev_store_url = "funrackets.myshopify.com"
automatically_update_urls_on_dev = true
include_config_on_deploy = true

[access_scopes]
# read_products: resource picker in the admin and price sync (v1.2).
# App-owned metafields (the per-store config) need no extra scope.
scopes = "read_products"

[auth]
redirect_urls = [
  "https://example.com/auth/callback",
  "https://example.com/auth/shopify/callback",
  "https://example.com/api/auth/callback"
]

[webhooks]
api_version = "2025-10"

  # Handled by: /app/routes/webhooks.app.uninstalled.jsx
  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = ["app/uninstalled"]

  # Handled by: /app/routes/webhooks.app.scopes_update.jsx
  [[webhooks.subscriptions]]
  topics = ["app/scopes_update"]
  uri = "/webhooks/app/scopes_update"

  # Mandatory compliance topics for a public listing. Add the handlers before app review.
  # [[webhooks.subscriptions]]
  # uri = "/webhooks/customers/data_request"
  # compliance_topics = ["customers/data_request"]
  # [[webhooks.subscriptions]]
  # uri = "/webhooks/customers/redact"
  # compliance_topics = ["customers/redact"]
  # [[webhooks.subscriptions]]
  # uri = "/webhooks/shop/redact"
  # compliance_topics = ["shop/redact"]

[pos]
embedded = false
