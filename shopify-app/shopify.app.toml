# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "a1b72ae7a95a6312f1f0587db9042df4"
name = "bundle-configurator"
# Production URL on Netlify. `shopify app dev` overrides it with the tunnel
# while running (automatically_update_urls_on_dev), then this is what
# `shopify app deploy` pushes. Change <site> once the Netlify site exists.
application_url = "https://bundle-configurator.netlify.app"
embedded = true

[webhooks]
api_version = "2026-10"

  # App lifecycle. Routes live in app/routes/webhooks.*.jsx.
  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "/webhooks/app/uninstalled"

  [[webhooks.subscriptions]]
  topics = [ "app/scopes_update" ]
  uri = "/webhooks/app/scopes_update"

  # Privacy compliance, required for a public listing. See webhooks.compliance.jsx
  # for what the app holds (a session and one shop metafield, no customer data).
  [[webhooks.subscriptions]]
  compliance_topics = [ "customers/data_request", "customers/redact", "shop/redact" ]
  uri = "/webhooks/compliance"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_products,read_themes"

[auth]
redirect_urls = [
  "https://bundle-configurator.netlify.app/auth/callback",
  "https://bundle-configurator.netlify.app/auth/shopify/callback",
  "https://bundle-configurator.netlify.app/api/auth/callback"
]

[build]
include_config_on_deploy = true
automatically_update_urls_on_dev = true
